<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#181329" />
      <stop offset="100%" stop-color="#07070B" />
    </radialGradient>
    
    <!-- Padlock Outer Metallic & Neon Gradients -->
    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    
    <linearGradient id="neonLime" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BEF264" />
      <stop offset="100%" stop-color="#A3E635" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="neonGlowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="neonGlowLime" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="#1F1A2F" stroke-width="6" />

  <!-- Grid Accents (Tech aesthetic) -->
  <g opacity="0.08" stroke="#8B5CF6" stroke-width="1">
    <line x1="64" y1="0" x2="64" y2="512" />
    <line x1="128" y1="0" x2="128" y2="512" />
    <line x1="192" y1="0" x2="192" y2="512" />
    <line x1="256" y1="0" x2="256" y2="512" />
    <line x1="320" y1="0" x2="320" y2="512" />
    <line x1="384" y1="0" x2="384" y2="512" />
    <line x1="448" y1="0" x2="448" y2="512" />
    
    <line x1="0" y1="64" x2="512" y2="64" />
    <line x1="0" y1="128" x2="512" y2="128" />
    <line x1="0" y1="192" x2="512" y2="192" />
    <line x1="0" y1="256" x2="512" y2="256" />
    <line x1="0" y1="320" x2="512" y2="320" />
    <line x1="0" y1="384" x2="512" y2="384" />
    <line x1="0" y1="448" x2="512" y2="448" />
  </g>

  <!-- Outer Ring (Radar/target alignment) -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#8B5CF6" stroke-width="2" opacity="0.15" />
  <circle cx="256" cy="256" r="230" fill="none" stroke="#BEF264" stroke-width="1" stroke-dasharray="8, 12" opacity="0.2" />

  <!-- Padlock (Scaled down and centered) -->
  <g transform="translate(89.6, 89.6) scale(0.65)">
    <!-- Padlock Shackle (Heavy Arch) -->
    <path d="M166 230 V160 C166 110.3 206.3 70 256 70 C305.7 70 346 110.3 346 160 V230" 
          fill="none" 
          stroke="url(#neonPurple)" 
          stroke-width="28" 
          stroke-linecap="round" 
          filter="url(#neonGlowPurple)" />

    <!-- Padlock Shackle Inner Trim -->
    <path d="M182 230 V160 C182 119.1 215.1 86 256 86 C296.9 86 330 119.1 330 160 V230" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="4" 
          stroke-linecap="round" 
          opacity="0.3" />

    <!-- Padlock Body (Solid, sleek hexagon/shield) -->
    <path d="M110 210 H402 C415 210 426 221 426 234 V390 C426 425 397 454 362 454 H150 C115 454 86 425 86 390 V234 C86 221 97 210 110 210 Z" 
          fill="#0D0D14" 
          stroke="url(#neonPurple)" 
          stroke-width="12" />

    <!-- Padlock Inner Accent lines -->
    <rect x="110" y="234" width="292" height="196" rx="20" fill="none" stroke="#2D1B4E" stroke-width="2" />

    <!-- Center Keyhole / Lightning Bolt Core (Active Energy, representing "Locked In") -->
    <g transform="translate(186, 250) scale(0.9)" filter="url(#neonGlowLime)">
      <!-- Lightning Bolt -->
      <polygon points="80,0 10,110 70,110 20,220 130,90 60,90" fill="url(#neonLime)" />
    </g>
  </g>

  <!-- High-energy crosshairs (Corner brackets) -->
  <path d="M 50 100 L 50 50 L 100 50" fill="none" stroke="url(#neonLime)" stroke-width="8" stroke-linecap="round" />
  <path d="M 462 100 L 462 50 L 412 50" fill="none" stroke="url(#neonLime)" stroke-width="8" stroke-linecap="round" />
  <path d="M 50 412 L 50 462 L 100 462" fill="none" stroke="url(#neonLime)" stroke-width="8" stroke-linecap="round" />
  <path d="M 462 412 L 462 462 L 412 462" fill="none" stroke="url(#neonLime)" stroke-width="8" stroke-linecap="round" />

</svg>
